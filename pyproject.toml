[project]
name = "helpdesk-lite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hamza", email = "hamzasaeed.bwp1@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.162.0",
    "greenlet>=3.5.6",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "python-dotenv>=1.2.4",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
helpdesk-lite = "helpdesk_lite:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.ruff.lint]
ignore = ["B008"]
